<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <!-- GitHub Pages cannot send headers, so the CSP lives here. No third-party scripts. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://wqyebqzbbpohbnznqdjj.supabase.co; img-src 'self' data: https://wqyebqzbbpohbnznqdjj.supabase.co; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
    <meta name="referrer" content="no-referrer">
    <title><%= productName %></title>
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">
    <link rel="icon" type="image/png" sizes="128x128" href="icons/icon-128x128.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  </head>
  <body>
    <!-- Shown at once, before the program arrives (owner 2026-10-30: «صفحة بيضاء: قل لي ماذا يحدث»).
         Plain HTML, then boot-loader.js (the CSP allows no inline script) says slow / no internet / failed. -->
    <div id="boot" style="position:fixed;inset:0;z-index:9999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;font-family:system-ui,sans-serif;color:#1B1F2A;text-align:center">
      <div style="width:36px;height:36px;border:4px solid #E4E6EC;border-top-color:#1565c0;border-radius:50%;animation:boot-spin 1s linear infinite"></div>
      <div id="boot-msg" style="font-size:16px;font-weight:600">جاري التحميل…</div>
      <div id="boot-sub" style="font-size:13px;color:#6b7280"></div>
      <div id="boot-actions" style="display:none;gap:8px">
        <button id="boot-retry" type="button" style="font:inherit;padding:8px 16px;border:0;border-radius:8px;background:#1565c0;color:#fff">أعد المحاولة</button>
        <button id="boot-copy" type="button" style="font:inherit;padding:8px 16px;border:1px solid #1565c0;border-radius:8px;background:#fff;color:#1565c0">انسخ التفاصيل</button>
      </div>
      <pre id="boot-detail" style="display:none;direction:ltr;text-align:left;font-size:11px;color:#6b7280;white-space:pre-wrap;max-width:100%;margin:0"></pre>
      <style>@keyframes boot-spin { to { transform: rotate(360deg) } } #boot.failed > div:first-child { display: none } #boot.failed #boot-actions { display: flex !important } #boot.failed #boot-detail { display: block !important }</style>
    </div>
    <script src="boot-loader.js"></script>
    <!-- quasar:entry-point -->
  </body>
</html>
